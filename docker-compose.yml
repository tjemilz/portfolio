services:
  # ===========================================
  # Django Backend API
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    labels:
      service: "portfolio-backend"
      description: "Django REST API for Portfolio"
    environment:
      - DEBUG=False
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${BACKEND_ALLOWED_HOSTS:-localhost,api.yourdomain.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://yourdomain.com}
      - SECURE_SSL_REDIRECT=False  # Handled by reverse proxy
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
    volumes:
      - ./backend/media:/app/media
      - ./backend/db.sqlite3:/app/db.sqlite3
      - backend_static:/app/staticfiles
    expose:
      - "8000"
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/galleries/public/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Next.js Frontend
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_MEDIA_URL=${NEXT_PUBLIC_MEDIA_URL:-/media}
    container_name: portfolio-frontend
    restart: unless-stopped
    labels:
      service: "portfolio-frontend"
      description: "Next.js React Frontend for Portfolio"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_MEDIA_URL=${NEXT_PUBLIC_MEDIA_URL:-/media}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - portfolio-network

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # Port 443 non nécessaire avec Cloudflare Tunnel
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/var/www/static:ro
      - ./backend/media:/var/www/media:ro
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-network

  # ===========================================
  # Certbot pour SSL (non nécessaire avec Cloudflare Tunnel)
  # Décommenter si vous n'utilisez PAS Cloudflare Tunnel
  # ===========================================
  # certbot:
  #   image: certbot/certbot
  #   container_name: portfolio-certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   profiles:
  #     - ssl

networks:
  portfolio-network:
    driver: bridge

volumes:
  backend_static:
